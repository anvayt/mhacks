[project]
name = "hidden-rent-asi-agent"
version = "0.1.0"
description = "ASI:One chat agent for API-grounded Ann Arbor rental energy estimates"
requires-python = ">=3.12,<3.13"
dependencies = ["uagents>=0.22,<0.24", "httpx>=0.27,<1"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
